server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:workflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null

flowable:
  database-schema-update: true
  check-process-definitions: false
  async-executor-activate: false
  process-definition-location-prefix: classpath:/processes/
  process-definition-location-suffixes:
    - "**.bpmn20.xml"

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      enabled: true
      show-details: when-authorized
    info:
      enabled: true

jwt:
  secret: change-me-in-production-please-change-me
  expiration-in-minutes: 10  # Access token expiration (10 mints)
  refresh-expiration-in-days: 1  # Refresh token expiration (7 days)

springdoc:
  api-docs:
    path: /api/docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  # Enable default OpenAPI 3.0 path as well
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

