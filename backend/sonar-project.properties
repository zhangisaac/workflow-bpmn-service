# SonarQube Project Configuration
# This file configures SonarQube analysis for the workflow-bpmn-service project

# Project identification
sonar.projectKey=zhangisaac:workflow-bpmn-service
sonar.projectName=Workflow BPMN Service
sonar.organization=zhangisaac
sonar.projectVersion=0.0.1-SNAPSHOT

# Source code
sonar.sources=src/main/java
sonar.tests=src/test/java

# Language and encoding
sonar.language=java
sonar.java.source=17
sonar.java.target=17
sonar.sourceEncoding=UTF-8

# Test reports
sonar.junit.reportPaths=target/surefire-reports,target/failsafe-reports

# Code coverage (JaCoCo)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.coverage.exclusions=**/dto/**,**/model/**,**/WorkflowBpmnServiceApplication.java

# Exclusions
# Exclude DTOs and models from analysis (they are simple data holders)
sonar.exclusions=**/dto/**,**/model/**,**/WorkflowBpmnServiceApplication.java

# Test exclusions
sonar.test.exclusions=**/*Test.java,**/*IntegrationTest.java

# Code duplication
sonar.cpd.exclusions=**/dto/**,**/model/**

# Issues
# Exclude generated files and resources
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.java
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S1068
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.java
sonar.issue.ignore.multicriteria.e3.ruleKey=java:S1186
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.java

# Quality Gate
# These thresholds can be configured in SonarQube UI
# sonar.qualitygate.wait=true

